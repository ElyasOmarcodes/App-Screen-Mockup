name: Extract ZIP to Main Branch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Extract ZIP and Cleanup
        run: |
          # ۱. د زیپ فایل ټول محتویات استخراجول
          7z x PixelDeck-fixed-source.zip -o./ -y
          
          # ۲. د زیپ دننه د نورو ورکفلو فایلونو (لکه apps.yml) پاکول ترڅو د Permission تېروتنه ورنکړي
          find .github/workflows/ -type f ! -name "extract.yml" -delete 2>/dev/null || true
          
          # ۳. د اصلي ZIP فایل لرې کول ترڅو ریپازټري درنه نشي
          rm -f PixelDeck-fixed-source.zip

      - name: Commit and Push to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "کوم نوی بدلون نشته."
          else
            git commit -m "Auto extract PixelDeck source files into main branch"
            git push
          fi
