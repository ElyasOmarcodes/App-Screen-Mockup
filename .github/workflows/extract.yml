name: Extract IPL File

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Find and Extract IPL Archive
        run: |
          mkdir -p extracted_files
          
          # د فایل ادرس په اتومات ډول موندل (قطعاً پاملرنه نه کوي چې غټ توري دي که واړه)
          FILE_PATH=$(find . -iname "*PixelDeck-fixed-source.IPL*" -type f | head -n 1)
          
          if [ -z "$FILE_PATH" ]; then
            echo "ERROR: د PixelDeck-fixed-source.IPL فایل په برانچ کې پیدا نشو!"
            echo "په ریپازټري کې موجود فایلونه دادي:"
            ls -la
            exit 1
          fi
          
          echo "فایل په دې ادرس پیدا شو: $FILE_PATH"
          7z x "$FILE_PATH" -oextracted_files/ -y

      - name: Upload Extracted Files
        uses: actions/upload-artifact@v4
        with:
          name: pixeldeck-extracted
          path: extracted_files/
