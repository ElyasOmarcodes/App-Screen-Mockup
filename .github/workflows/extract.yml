name: Organize Source Code to Root

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract, move files to root and cleanup
        run: |
          # ۱. د زیپ فایل استخراجول (که شتون ولري)
          if [ -f "PixelDeck-fixed-source.zip" ]; then
            7z x PixelDeck-fixed-source.zip -o./ -y
          fi

          # ۲. د PixelDeck-fixed فولډر دننه ټول فایلونه روټ (اصلي لارې) ته رانقلول
          if [ -d "PixelDeck-fixed" ]; then
            shopt -s dotglob
            mv PixelDeck-fixed/* ./
            shopt -u dotglob
            rm -rf PixelDeck-fixed
          fi

          # ۳. د زړو او اضافي فایلونو (Zip او Zip Extractor) پاکول
          rm -f PixelDeck-fixed-source.zip "Zip Extractor"

      - name: Commit and Push changes to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          # کله چې بدلون راشي د تکراري اتوماتیک رن کېدو مخنیوي لپاره [skip ci] وژني
          if git diff --staged --quiet; then
            echo "کوم نوی بدلون نشته."
          else
            git commit -m "Organize PixelDeck source files to root directory [skip ci]"
            git push
          fi
