name: Extract and Commit to Main Branch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# د دې لپاره چې اکشن ته په برانچ کې د بدلون راوستلو (Push) اجازې ورکړل شي
permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract ZIP File into main directory
        run: |
          # فایلونه نیغ په نیغه په ریپازټري کې استخراجول
          7z x PixelDeck-fixed-source.zip -o./ -y
          
          # که غواړئ اصلي zip فایل له استخراج وروسته حذف شي، لاندې لېکه فعال کړئ:
          # rm PixelDeck-fixed-source.zip

      - name: Commit and Push extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          # که نوي فایلونه زیات شوي وي، کمټ او پُش یې کړه
          if git diff --staged --quiet; then
            echo "کوم نوی بدلون نشته."
          else
            git commit -m "Auto-extracted PixelDeck-fixed-source.zip contents into main branch"
            git push
          fi
